<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta property="og:title" content="United Olympics Sports | يونايتد أوليمبيكس سبورت" />
    <meta property="og:description" content="A thoughtful sports development environment for structured training, discipline and progress. | بيئة متكاملة للتطوير الرياضي والتدريب المنظم والانضباط والتقدم." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#f6f1e6" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/brand/united-olympics-sports-logo.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="UOS" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Outfit:wght@500;600;700;800&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Cinzel:wght@600;700;800;900&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700;800;900&family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet" />
    <script>
      (() => {
        const defaults = { appearance: 'system', bilingualOrder: 'en-first', density: 'comfortable', motion: 'system', fontScale: 'default', sidebarDefault: 'expanded' };
        const allowed = {
          appearance: ['light','dark','system'], bilingualOrder: ['en-first','ar-first'], density: ['comfortable','compact'], motion: ['system','reduced'], fontScale: ['default','large'], sidebarDefault: ['expanded','collapsed']
        };
        let settings = defaults;
        try {
          const raw = localStorage.getItem('uos:ui-settings:v1');
          const candidate = raw ? JSON.parse(raw) : null;
          if (candidate && Object.keys(allowed).every((key) => allowed[key].includes(candidate[key]))) settings = candidate;
        } catch { settings = defaults; }
        const prefersDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false;
        const mode = settings.appearance === 'system' ? (prefersDark ? 'dark' : 'light') : settings.appearance;
        const root = document.documentElement;
        root.dataset.theme = mode;
        root.dataset.appearance = settings.appearance;
        root.dataset.bilingualOrder = settings.bilingualOrder;
        root.dataset.density = settings.density;
        root.dataset.motion = settings.motion;
        root.dataset.fontScale = settings.fontScale;
        root.dataset.sidebarDefault = settings.sidebarDefault;
        root.style.colorScheme = mode;
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', mode === 'dark' ? '#07080b' : '#f6f1e6');
      })();
    </script>
    <meta property="og:image" content="/brand/united-olympics-sports-logo.png">
    <meta name="twitter:image" content="/brand/united-olympics-sports-logo.png">
</head>
  <body class="font-sans antialiased overflow-x-hidden" style="background-color: #07090e;">
    <div id="root">
      <div id="app-preloader" style="position: fixed; inset: 0; background: #07090e; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="position: relative; width: 72px; height: 72px; margin-bottom: 20px; display: flex; align-items: center; justify-content: center;">
          <div style="position: absolute; inset: -8px; border: 2px solid rgba(212, 175, 55, 0.2); border-top-color: #d4af37; border-radius: 50%; animation: uos-spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;"></div>
          <img src="/brand/united-olympics-sports-logo.png" alt="United Olympics Sports" style="width: 52px; height: 52px; object-fit: contain;" />
        </div>
        <div style="color: #f3ce5a; font-size: 13px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 6px;">
          United Olympics Sports
        </div>
        <div style="color: #94a3b8; font-size: 11px; letter-spacing: 0.05em;">
          يونايتد أوليمبيكس سبورت
        </div>
        <style>
          @keyframes uos-spin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
